name: cortex-tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cortex-mcp -> target

      - name: Build (default SQLite)
        run: cargo build --workspace --verbose

      - name: Run tests (default SQLite)
        run: cargo test --workspace --verbose

      - name: Build with Postgres feature
        run: cargo build -p cortex-core --no-default-features --features postgres

      - name: Build release binary
        run: cargo build --release -p cortex-mcp-server

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # Soft lint : on ne fail pas sur les warnings pré-existants.
      # Les warnings seront fixés progressivement dans des sessions dédiées.
      # Seuil actuel : 0 erreurs clippy (les warnings passent).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -A warnings

      - name: Format check
        run: cargo fmt --all -- --check
