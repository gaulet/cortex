[package]
name = "cortex-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core domain model for Cortex MCP"

[features]
# Backend par défaut : SQLite (léger, parfait pour tests et mode embedded).
# Les deux backends sont mutuellement exclusifs.
# Pour utiliser Postgres : `cargo build --no-default-features --features postgres`.
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
