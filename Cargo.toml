[workspace]
members = [
    "crates/cortex-core",
    "crates/cortex-actors",
    "crates/cortex-brains",
    "crates/cortex-security",
    "crates/cortex-webhooks",
    "crates/cortex-mcp-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cortex Team"]
license = "MIT"
repository = "https://github.com/cortex-project/cortex-mcp"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "tracing", "signal"] }
tokio-util = { version = "0.7", features = ["rt", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }

# Cryptography
hmac = "0.12"
sha2 = "0.10"

# Utils
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"

# Testing
proptest = "1.5"
